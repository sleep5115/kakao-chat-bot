name: kakao-chat-bot

services:
  kakao-bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: kakao-bot
    restart: unless-stopped
    env_file:
      - ${KAKAO_BOT_ENV_FILE:-/home/ubuntu/.config/kakao-bot/runtime.env}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pickty-infra

networks:
  pickty-infra:
    external: true
    name: pickty-infra_default

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kakao-chat-bot"
version = "0.1.0"
description = "FastAPI backend for the KakaoTalk Iris gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.5,<3",
    "fastapi>=0.115,<1",
    "httpx2>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
kakao-bot = "kakao_bot.__main__:main"
discord-kakao-bot = "kakao_bot.discord_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
